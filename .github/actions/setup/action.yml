name: Setup
description: Install pnpm, Node.js and the dependencies

inputs:
  node-version:
    description: Node.js version
    default: '24'
  registry-url:
    description: npm registry for publishing
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
